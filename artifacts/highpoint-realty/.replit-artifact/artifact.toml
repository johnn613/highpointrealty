kind = "web"
previewPath = "/"
title = "High Point Realty & Auction"
version = "1.0.0"
id = "artifacts/highpoint-realty"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 21458
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/highpoint-realty run dev"

[services.env]
PORT = "21458"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/highpoint-realty", "run", "build"]
publicDir = "artifacts/highpoint-realty/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
